# Plain static site: no build step, publish the repo root.
[build]
  publish = "."
  command = ""

[[headers]]
  for = "/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=604800"

[[headers]]
  for = "/*"
  [headers.values]
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"

# Old Squarespace addresses (johnorton.co.uk), so old links and search results don't hit "page not found".
# Pages with a matching section on the new site go there; dropped pages go to the home page.
[[redirects]]
  from = "/portfolio"
  to = "/#photography"
  status = 301

